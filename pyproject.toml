[project]
name = "scripture-pipelines"
version = "0.2.1.24"
description = "Declarative pipelines for LLM-powered workflows"
authors = [{name = "Jonathan Robie", email = "jonathan.robie@gmail.com"}]
license = {text = "MIT"}
keywords = ["llm", "ai", "pipeline", "workflow", "nlp", "openai", "anthropic", "gemini"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.3",
  "lxml>=6.0",
  "pyyaml>=6.0.1",
  "httpx>=0.28",
  "openai>=2.30.0",
  "markdown",
  "basexclient>=8.4",
  "llm>=0.29",
  "mcp>=1.26.0",
  "rich>=13.0",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "saxonche>=12.0",
  "jsonschema>=4.20",
  "mdformat>=0.7",
  "usfmtc>=0.4.5",
  "duckdb>=1.0.0",
  "pandas>=1.5.0",
  "flask>=3.0.0",
  "flask-socketio>=5.3.0",
  "flask-cors>=4.0.0",
  "python-socketio>=5.10.0",
  "tiktoken>=0.7.0",
  "certifi",
]
readme = "README.md"
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/nida-institute/LLMFlow"
Repository = "https://github.com/nida-institute/LLMFlow"
Documentation = "https://github.com/nida-institute/LLMFlow/blob/main/README.md"
"Bug Tracker" = "https://github.com/nida-institute/LLMFlow/issues"
Changelog = "https://github.com/nida-institute/LLMFlow/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llmflow"]

[tool.hatch.build.targets.wheel.force-include]
"docs/ai-context" = "llmflow/docs/ai-context"
"docs/audits" = "llmflow/docs/audits"
"data/models.json" = "llmflow/data/models.json"
"data/file-catalog.yaml" = "llmflow/data/file-catalog.yaml"
"data/ai-rules.yaml" = "llmflow/data/ai-rules.yaml"

[project.scripts]
sp = "llmflow.cli:main"
sp-gui = "llmflow.gui_launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default]
dependencies = [
  "pytest",
  "pytest-asyncio",
  "pytest-mock"
]
post-install-commands = [
  "pip install -e ."
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]  # Allow imports not at top for special cases
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"