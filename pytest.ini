[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --basetemp=tmp/pytest

# Where the suite writes, and what survives a run (#207). Declared here rather than in code so
# it can be read without opening conftest.py.
#
#   --basetemp=tmp/pytest      every per-test directory lands inside this repository, under
#                              `tmp/`, which self-ignores — so intermediates cannot be committed
#                              and are still in plain sight. Resolved against the repository root
#                              by `pytest_configure`, so it holds when pytest is run from a
#                              subdirectory. pytest empties a configured basetemp on the way in,
#                              which is what makes a failed run's leftovers last exactly until
#                              the next run.
#   tmp_path_retention_policy  `failed`: a passing test's directory goes immediately, so what is
#                              left in tmp/pytest/ is only what failed. Captain, 2026-08-25:
#                              "keep only what failed" and "delete it the next time pytest runs".
#
# Before this, one full run left 36 MB and 111 dummy stores in the machine's temp area, pytest
# retained three runs, and incomplete rotations had accumulated 4,773 orphan directories.
tmp_path_retention_policy = failed
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    duckdb: marks tests that require the duckdb package