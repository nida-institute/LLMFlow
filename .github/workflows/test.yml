name: Tests

# Fast Linux test signal on direct branch pushes. Pull-request testing (and the
# gate before the executable build) is owned by build.yml, so this workflow no
# longer runs on pull_request to avoid double-running the suite.
on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install hatch
      run: pip install hatch

    - name: Setup Node.js for GUI tests
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: gui/frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd gui/frontend
        npm ci

    - name: Run frontend tests
      run: |
        cd gui/frontend
        npm test -- --run

    - name: Type-check frontend
      run: |
        cd gui/frontend
        npx tsc --noEmit

    - name: Build GUI (verify build works)
      run: python build_gui.py

    - name: Type-check Python with Pyright
      run: hatch run pytest tests/test_types.py -v

    - name: Run backend tests
      run: hatch run pytest tests/ -q --tb=short -m "not integration"
      env:
        # Integration tests requiring real API keys are skipped when these are absent
        OPENAI_API_KEY: ""
        ANTHROPIC_API_KEY: ""
        GEMINI_API_KEY: ""
