name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install hatch
      run: pip install hatch

    - name: Setup Node.js for GUI tests
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: gui/frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd gui/frontend
        npm ci

    - name: Run frontend tests
      run: |
        cd gui/frontend
        npm test -- --run

    - name: Build GUI (verify build works)
      run: python build_gui.py

    - name: Run backend tests
      run: hatch run pytest tests/ -q --tb=short
      env:
        # Integration tests requiring real API keys are skipped when these are absent
        OPENAI_API_KEY: ""
        ANTHROPIC_API_KEY: ""
        GEMINI_API_KEY: ""
