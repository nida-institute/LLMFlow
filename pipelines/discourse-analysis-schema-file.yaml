name: discourse-analysis-schema-file-example

variables:
  passage: "${passage}"

llm_config:
  model: gpt-4o-2024-08-06
  temperature: 0.7
  max_tokens: 2000

steps:
  - name: analyze_discourse
    type: llm
    model: gpt-4o-2024-08-06
    output_type: json
    response_format:
      type: json_schema
      json_schema:
        name: discourse_analysis
        strict: true
        schema_file: schemas/discourse_analysis.json
    prompt:
      file: prompts/discourse-analysis.gpt
      inputs:
        passage: "${passage}"
    outputs: analysis
    saveas: outputs/discourse/${passage}_analysis.json
