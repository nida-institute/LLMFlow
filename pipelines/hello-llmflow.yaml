name: "Hello Multilingual Pipeline"
description: |
  Sample pipeline generated by `sp init`.
  Run it with:
    sp run --pipeline pipelines/hello-llmflow.yaml
variables:
  prompts_dir: "prompts"
  output_dir: "output"

output_file_directory: "output"

llm_config:
  model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 500

steps:
  - name: "multilingual-greeting"
    type: "llm"
    prompt:
      file: "hello.gpt"
      inputs:
        language_count: 5
    output: greeting
    saveas:
      path: "${output_dir}/hello.md"

  - name: "respond-to-greetings"
    type: "llm"
    prompt:
      file: "reply.gpt"
      inputs:
        greeting_markdown: "${greeting}"
    output: reply_block
    saveas:
      path: "${output_dir}/responses.md"
