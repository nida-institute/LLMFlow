name: "Test Storyflow Pipeline"
description: |
  A one-step pipeline that runs without an API key, used as a fixture by the linter and
  prompt-resolution tests. Run from the repo root:
    sp run --pipeline pipelines/storyflow-test.yaml

  The step calls an engine function rather than a mock, so `sp lint` on this file exercises the
  same resolution a real pipeline gets. It used to name `tests.test_storyflow_pipeline`, a module
  that has never existed — nothing caught it, because every test that reads this file reads it as
  YAML and none runs the step.

llm_config:
  model: "gpt-4o"
  temperature: 0.7
  max_tokens: 4000

variables:
  psalm_reference: "Psalm 1:1-3"
  prompts_dir: "prompts"

steps:
  - name: "test_step"
    type: "function"
    function: "llmflow.utils.data.parse_bible_reference"
    inputs:
      passage: "${psalm_reference}"
    output:
      - parsed_reference
