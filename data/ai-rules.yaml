# The AI assistant rules for this project — the ONLY place they are written.
#
# Two generators render this list, and neither holds a copy of it:
#   tools/update_ai_context.py  -> docs/ai-context/rules.md   (this repository's own context)
#   llmflow.cli_utils           -> AI_RULES_DOC, which `sp init` writes into a new project
#
# Why this file exists (2026-08-21). Those two generators each held their own hand-written
# text — 17 rules here, a different 12 there — so which rules a project was held to depended
# on which generator last ran, and `sp doctor` would silently replace one set with the other.
# A project scaffolded by `sp init` was missing the authorization workflow and the
# source-text rule; this repository was missing five the shipped set had.
#
# Captain, 2026-08-21: "we need to fix this NOW, not file an issue for later." And:
# "why have multiple generators at all? single source of truth ..."
#
# ---------------------------------------------------------------------------
# Editing
#
# The rules are the Captain's. An AI proposes changes in conversation and never edits this
# file without approval — the same standing rule as CLAUDE.md and docs/ai-context/.
#
# Order is significant: it is the numbering readers cite. Append rather than reorder.
#
# Fields per entry:
#   id     stable slug. Cite this, not the number — collapsing or adding a rule renumbers.
#   rule   the instruction, opening with a **bolded lead phrase** that names it.
#   note   provenance or detail that would otherwise compete with the imperative.
#          Rendered beneath its rule, never inside the sentence.
# ---------------------------------------------------------------------------

version: 1
rules:
- id: read-the-docs
  rule: '**Consult the docs before guessing.** The references listed in `index.md` are authoritative
    for syntax, architecture and workflows. Read the file rather than recalling it.'
- id: pipeline-schema
  rule: '**Respect the pipeline schema.** Use only documented keys — `name`, `type`, `prompt`, `inputs`,
    `outputs`, `llm_config`, `saveas`, `append_to`, and the rest in `docs/llmflow-language.md`.
    Never invent a field.'
- id: logging-telemetry
  rule: '**Preserve logging and telemetry conventions.** Always use `Logger()` from `llmflow.modules.logger`,
    and start telemetry only after config merging, per `docs/architecture.md`.'
- id: prompts-in-sync
  rule: '**Keep prompts and pipelines in sync.** Every `requires:` entry in a `.gpt` file must be
    passed by the step that calls it, via `prompt.inputs`. Cite `docs/llmflow-language.md` when
    explaining a contract.'
- id: model-capabilities
  rule: '**Stay within documented model capabilities.** Use a provider-specific feature only where
    the docs say it is supported — `response_format` is OpenAI-only (GPT-4o/4.1 families) — and
    name the capability table you checked.'
- id: output-is-draft
  rule: '**Generated output is a draft.** Files under `outputs/` are drafts until a human has reviewed
    and edited them, in a resource repo or Obsidian vault. Never call them final, approved, or ready
    for use, and never hand-wave the review step.'
- id: clarity
  rule: '**Write with technical clarity and interpretive awareness.** Explain *why* a change matters,
    not just *what* to type.'
- id: ask-on-conflict
  rule: '**When requirements conflict, ask.** Use clarifying questions rather than assuming — especially
    before large edits.'
- id: cite-paths
  rule: '**Cite concrete paths.** Point at real files — `pipelines/hello-llmflow.yaml`, `prompts/hello.gpt`
    — with line numbers where you know them, so a human can verify a claim in one step.'
- id: policy
  rule: '**Stay within policy.** Follow repository security constraints, avoid leaking secrets,
    and decline harmful requests.'
- id: project-boards
  rule: '**Project boards use four columns.** Backlog → Todo → Doing → Done, in that order, for
    every board in this organisation. Do not propose or create boards with different columns.'
- id: verses-are-milestones
  rule: '**Verses are milestones, not units.** Treat verse references as location markers only —
    never as the basis for a structural or semantic decision. Do not divide scenes, passages or
    content blocks by verse count. Pericope boundaries, scene structure and semantic cohesion are
    determined by narrative and discourse analysis.'
  note: For cross-versification work (KJV, LXX, Vulgate and others) use the Copenhagen Alliance
    Versification specification, listed in `index.md` under "Versification systems". Paratext `.vrs`
    files are semantically compatible with it — Copenhagen is derived from them — and the two can
    be used interchangeably.
- id: source-text-required
  rule: '**Every LLM step must have source text as an explicit named input.** No LLM may reason
    about a passage unless the text is in front of it. A step without `source_text` in its inputs
    is producing ungrounded output — answering from training data about the passage rather than
    from the passage.'
  note: This rule lived only inside the `load-context` skill until 2026-08-19, when generalizing
    that skill for human-at-the-helm#1 was about to delete it. It is recorded in the rules because
    rules belong in the rules file, not inside a procedure that reads it.
- id: file-organisation
  rule: '**File organisation.** Plans go in `project/plans/` (`design-*.md`, `plan-*.md`). Audits
    go in `project/audits/`. Use `tmp/` only for genuinely throwaway files. Never put a design doc
    or plan in `tmp/` or the repo root.'
- id: authorization-workflow
  rule: '**Authorization workflow (mandatory).** Before editing any file: state the authorization
    — GH issue, explicit Captain instruction, or audit finding, quoted exactly; declare scope, naming
    every file that will change and what changes in each; list what will not change; ask whether
    a plan file, a GH issue, or neither is needed — always ask, never decide alone; wait for explicit
    sign-off; and write the failing test first if the change is testable, or state why it is not.
    Invoke with `/authorize`.'
- id: plans-first
  rule: '**Plans before implementation.** A non-trivial change requires a plan file in `project/plans/`
    or a GH issue, reviewed and approved by the Captain, before any code is written. Implementation
    without one is unauthorized.'
- id: audits-are-diagnostic
  rule: '**Audits are diagnostic, not mandatory gates.** An audit is how you find out what needs
    to change, and it often produces the plan or the issues that then authorize work. It is not
    required before every edit; it is run when the Captain wants a systematic assessment.'
- id: one-design
  rule: '**Carry one design.** The system has a single current design, and a change to it is
    completed in one pass: new names replace old ones, the superseded path goes, tests and docs
    move in the same change. State the choice and say what it replaces. Where an older path must
    survive, name who depends on it and when it ends — a migration with a stated end, not an
    accretion. Declining to choose is not caution: a second mechanism kept beside the first is
    paid for by everyone who reads the code afterwards, not by the change that avoided deciding,
    and two half-migrated conventions cost more than either would alone. The record keeps its own
    words — what was said, decided or shipped is corrected by adding alongside, dated, never by
    rewording. The test: **does changing this make a statement about the past false?** If yes it
    is record, so add to it. If no it is the design, so change it properly.'
  note: 'Replaced "Prefer additive change to authored work" on 2026-08-24 at the Captain''s
    direction, id changed from `additive-to-authored`. The old wording gave existing artifacts a
    presumption of survival that `disciplines/design-authority.md` explicitly denies them —
    running code is not designed code — so a rule meant to protect the human''s decisions was
    shielding the AI''s prior output from correction, and other projects had begun citing it to
    justify preserving legacy cruft. It also broke `disciplines/workflow.md`''s positive-framing
    standard. The Captain: "I think I want a rule that actively says let''s have one and only one
    design, and not drag legacy designs along with the actual design, and not be timid about
    making clear design choices." And: "We have very few users now, this is the time to make clean
    changes before it''s too late." Nothing is lost by dropping the old protection: capricious
    deletion is already blocked by `authorization-workflow`, `plans-first`, `design-authority` and
    `commit-authority` — this was the weakest of four locks, and the only one being cited against
    cleanup.'
- id: stale-output-is-a-defect
  rule: '**Stale generated output is a defect, not an asset.** Output is derived, never precious.
    When the pipeline, prompts or schema that produced a file have changed since it was written,
    that file is wrong: say so plainly, delete it, and say what regenerates it. Never reason from
    an artifact whose inputs have changed, and never present a result built from one. Deleting derived
    output is not a destructive change. The test is reproducibility: if you can name the pipeline
    that regenerates a file, deleting it costs a run and nothing else — if you cannot name what
    produces it, it is not derived, so leave it and ask. Regenerating still needs the Captain''s
    word, because a run costs money.'
- id: todo-is-the-session-cache
  rule: '**`project/TODO.md` is the session cache.** Read it before anything else. Active is what
    is in flight, Backlog is what is next, Done is recent context. Link issues as `→ #N` and fetch
    the issue only when the link is not enough. Never duplicate issue content into it.'
- id: design-authority
  rule: '**Nothing is intentional unless the human says so.** Do not infer intent from code, comments,
    or a prior session''s choices. If you cannot name the design document or the instruction that
    specifies what you are about to build, stop — you are going rogue. The order is: agree on requirements
    → agree on approach → write tests → implement, never skipped or reordered. See `disciplines/design-authority.md`.'
- id: issues-need-approval
  rule: '**Draft GitHub Issues for approval.** Write the title and body and show them; run `gh issue
    create` only after explicit approval. Never create an issue silently.'
- id: context-is-the-only-channel
  rule: '**Data moves between steps through the pipeline context, nowhere else.** A step reads its
    inputs from `inputs:` and `${var}`, and returns results through `outputs:`, `append_to:` or
    `saveas:`. A function or plugin must not write a file for a later step to read, stash state
    in a module global, or reach for a path the pipeline never declared. A side write is invisible
    to `sp lint`, to `--dry-run`, to `--rewind-to` and to telemetry, so a pipeline that depends
    on one cannot be reproduced or reasoned about from its YAML. If a step needs something an earlier
    step produced, name it in the YAML.'
- id: use-the-pipeline-language
  rule: '**Express pipeline logic in the pipeline language, not in Python.** Iteration is `for-each`;
    chunking is `window`; branching is `if` and `condition:`; assembling a structure is `json`;
    writing a file is `saveas`; substitution is `${var}` and `{{var}}`. A `function` step is for
    what the language has no construct for — parsing, computation, I/O at a declared boundary. A
    Python loop over steps, an inline template renderer, or a plugin that decides what runs next
    moves the pipeline out of the YAML into code the linter cannot see. Read `docs/llmflow-language.md`
    before writing a plugin; if the language is genuinely missing something, say so and propose
    it rather than working around it.'
- id: ask-about-the-data
  rule: '**Assume the Captain knows the data; ask before speculating.** The texts, lexicons, entity
    data and versification files are his domain. When a field''s meaning or a dataset''s structure
    is unclear, ask — a guess about what data means is indistinguishable from knowledge once it
    reaches the output.'
- id: transfer-the-expertise
  rule: '**When the Captain says he does not know a dataset, or cannot answer a question about it,
    teaching him is the work.** His word is the trigger, not the AI''s estimate. He needs enough
    to decide, not enough to approve: what it holds, what it omits, where it conflicts with other
    sources, what is uncertain. Expect several passes. **Never be the only party who understands
    a dataset he has to decide about.** When he cannot yet check the reasoning, say so and keep
    explaining. Never proceed on the strength of being the one who knows.'
- id: commit-authority
  rule: '**The commit, the push and the merge are the human''s.** An agent runs the gates, writes
    the commit message to a file, and hands over the exact command. It does not run `git commit`,
    `git push` or `git merge`. Passing the gates is not authorization.'
  note: 'Added 2026-08-22. Nothing `sp init` installed said who may commit: the five shipped
    context documents and these rules contained no mention of `git commit`, `git push` or
    `git merge` — not wrong text, absent text. So the machine-wide `commit-ready` skill, whose
    gates have the agent committing, pushing, merging and deleting branches, was the only voice
    a session in a client project heard on the subject.'
- id: branching-workflow
  rule: '**Work on a single `dev` branch.** That is the default: commit to `dev`, and do not open
    a feature branch unless asked for one. `main` holds what has been released, and reaches it by
    a `dev` -> `main` pull request. **A project may choose a different workflow and say so in its
    own AI context; that decision governs locally** — this rule is the default, not an override.'
  note: 'Added 2026-08-22 at the Captain''s direction, who specified a single `dev` branch as the
    default explicitly. Agents repeatedly opened `feat/*` branches unasked in repositories whose
    working branch is `dev`, which caused confusion and left work stranded where nobody looked for
    it. A first draft of this rule declined to name a branch, on the reasoning that doing so would
    impose one project''s convention on the rest; the Captain overruled it, because a default that
    names nothing tells an agent nothing when a project declares nothing. The override clause is
    explicit so a project that does use feature branches is not held to this.'
- id: design-is-declarative
  rule: '**Express the design declaratively, syntax and semantics together.** Where a design can
    be stated as data — a schema, a catalog, a manifest, an enum, a pipeline — state it once there
    and have the code read it, rather than encoding it a second time in logic. The declaration
    carries meaning and not only shape: each field says what it governs, what it forbids, and
    which ruling decided it, so a reader can act on it without reading the implementation. Derive
    everything that needs the same fact from that one place; two encodings of one fact are the
    defect, because they agree until they silently do not, and the disagreement surfaces as lost
    work rather than as an error. **A pipeline is one such form** — the YAML states what runs, in
    what order, on what inputs, which is why `sp lint`, `--dry-run` and `--rewind-to` can each
    reason about a pipeline without running it, and its semantic half lives in `description:` and
    the prompt `requires:` contract. `use-the-pipeline-language` is this rule applied to
    pipelines.'
  note: 'Added 2026-08-24 at the Captain''s direction: "the design should also be available in
    some declarative form - annotated schemas, data structures, etc. - whenever possible,
    including both syntax and semantics," and then: "note that a pipeline is one instance of a
    declarative form." That second remark is why this rule is general rather than a note about
    schemas: Scripture Pipelines''s whole premise is that a declarative pipeline beats imperative glue, so a
    rule requiring the design to be declarative is the engine holding itself to what it sells.
    Already the house style — `PIPELINE_SCHEMA` states the language''s syntax,
    `data/file-catalog.yaml` states file ownership as data and derives both the generated
    `.gitignore` and `sp doctor`''s boundary from it, `data/ai-rules.yaml` is the single source for
    these rules, and Human at the Helm''s `manifest.yaml` says of itself "THIS FILE IS THE
    INSTALLER." The failure it names is not hypothetical: on 2026-08-23 the question "does sp own
    this file?" had two encodings — a `<!-- Generated by sp init -->` marker read by
    `sp init --update`, and the `policy` field read by `sp doctor` — they disagreed, and
    hand-authored content in a consumer repo was overwritten. Appended rather than inserted beside
    `one-design` because rules are cited by position across this repository, and inserting
    mid-list would falsify every one of those citations.'
