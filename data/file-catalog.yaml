# Catalog of the files `sp init` manages (#204, plan D7).
#
# Ownership used to be decided by sniffing for `<!-- Generated by sp init -->` on line 1.
# That marker was the only test `sp init --update` applied, and its text had already
# drifted in shipped code — `cli.py` advertises `llmflow init` while the constant in
# `cli_utils.py` says `sp init`.
#
# Captain, 2026-08-18: "Relying on this marker is fragile. We need a catalog that says
# what files sp init works on. We have already had failures when subsequent versions of
# our software changed the exact text in that string." And: ".claude files belong in the
# catalog too, so we don't lose sight of them."
#
# Two things are DERIVED from this file rather than maintained beside it:
#   - the `.gitignore` sp generates (D9) — from the `committed` field
#   - `sp doctor`'s ownership boundary (D10) — from the `policy` field
# Deriving both is what stops them disagreeing with each other.
#
# ---------------------------------------------------------------------------
# Fields
#
#   path       where the file lives, relative to its scope root
#   scope      project | sp-home        (the project directory, or ~/.sp)
#   policy     generated   sp owns the content; restored when missing or diverged
#              create-once sp writes it if absent, then never touches it again
#              user-owned  sp never writes it
#   source     template | constant | sp-home | none
#   committed  true  -> belongs in git, must never appear in the generated .gitignore
#              false -> goes in the generated .gitignore
#   constant   name of the string constant in cli_utils, when source is `constant`
#   block      delimiter name when sp owns only a block of the file, not all of it
#
# `groups` expand from what the package actually ships, so adding a template needs no
# edit here. A second hand-kept list is how three disciplines went unshipped for months.
# ---------------------------------------------------------------------------

version: 1

groups:
  - id: disciplines
    label: Disciplines
    templates: "sp-disciplines/*.md"
    path: "disciplines/{name}"
    scope: sp-home
    policy: generated
    source: template
    committed: false

  - id: sp-root-files
    label: Root files
    templates: "sp-root/*.md"
    path: "{name}"
    scope: sp-home
    policy: generated
    source: template
    committed: false

  - id: sp-skills
    label: Skills in ~/.sp
    templates: "sp-skills/*"
    requires: SKILL.md
    path: "skills/{name}"
    scope: sp-home
    policy: generated
    source: template
    committed: false

  # D1-A′: skills are copied into the repo and committed. A clone that does not receive
  # them has no slash commands, which is the failure #204 exists to remove.
  - id: project-skills
    label: Project skills
    templates: "sp-skills/*"
    requires: SKILL.md
    path: ".claude/skills/{name}"
    scope: project
    policy: generated
    source: sp-home
    committed: true

files:
  # The four sp-generated context documents. Ours; restored when they drift.
  # Two indexes, ruled 2026-08-24 (Q1). One `index.md` claimed to be the whole map and
  # invited a project to add its own entry documents to a file sp owned; doctor then
  # overwrote them. The split puts the derivable half under sp and the authored half under
  # the project, because one file could not be both.
  #
  # The project's map. create-once: sp cannot generate it — the Captain, on why: "we can't
  # know what files a project has created in advance."
  - path: docs/ai-context/project-index.md
    scope: project
    policy: create-once
    source: constant
    constant: AI_INDEX_DOC
    committed: true
    purpose: >-
      This project's own map — read first. Yours to write; sp never overwrites it.

  # sp's inventory, rendered from this file. `source: derived` rather than a constant,
  # because a constant would be a second hand-kept list of sp's own documents — the failure
  # file_catalog.py's docstring blames for three conventions going unshipped for months.
  - path: docs/ai-context/sp-index.md
    scope: project
    policy: generated
    source: derived
    committed: true
    purpose: >-
      The documents Scripture Pipelines ships, and what each is for. Rendered from
      data/file-catalog.yaml, so it cannot go stale.

  - path: docs/ai-context/overview.md
    scope: project
    policy: generated
    source: constant
    constant: AI_OVERVIEW_DOC
    committed: true
    purpose: >-
      What this project is and how its pipelines are organised.

  - path: docs/ai-context/rules.md
    scope: project
    policy: generated
    source: constant
    constant: AI_RULES_DOC
    committed: true
    purpose: >-
      The rules every AI session in this project is held to. Authoritative.

  - path: docs/ai-context/github-workflow.md
    scope: project
    policy: generated
    source: constant
    constant: GITHUB_WORKFLOW_DOC
    committed: true
    purpose: >-
      Issue references, version numbering, CHANGELOG and gh CLI conventions.

  # The one file a project is invited to write for itself. Captain, on D10: "projects
  # have a place to write their own context, and it's not in the standard context files
  # that we write." sp creates it if absent and never touches it again.
  - path: docs/ai-context/project.md
    scope: project
    policy: create-once
    source: constant
    constant: AI_PROJECT_DOC
    committed: true
    purpose: >-
      This project's own context — facts, conventions and gotchas. Yours to own.

  # Documents sp init writes outside docs/ai-context/. Absent from this catalog until
  # 2026-08-23, which meant `sp doctor` could not see them: when c1647af fixed the
  # window-cursor example inside LANGUAGE_QUICKREF_DOC — an example that had already cost
  # real content in a consumer repo — doctor had no way to push the fix out. Reported from
  # nida-institute/discourse-flow. Policies below match what each write site actually does.
  - path: docs/tutorial.md
    scope: project
    policy: generated
    source: constant
    constant: TUTORIAL_DOC
    committed: true
    purpose: >-
      Step-by-step walkthrough: variables, saveas, and a two-step pipeline.

  - path: docs/llmflow-language-quickref.md
    scope: project
    policy: generated
    source: constant
    constant: LANGUAGE_QUICKREF_DOC
    committed: true
    purpose: >-
      The pipeline YAML reference — step types, variables, window and for-each.

  - path: docs/vscode.md
    scope: project
    policy: generated
    source: constant
    constant: VSCODE_DOC
    committed: true
    purpose: >-
      VS Code setup for editing pipelines and prompts.

  # The hello-world example. Ruled 2026-08-24, Q3 of
  # `project/plans/plan-init-doctor-unification.md`: "sp init creates them by default; with
  # --update, it refreshes them if they are present and does nothing if they are absent."
  # `generated` at project scope is exactly that — `doctor` restores a project file only when
  # it is present and has diverged (`doctor.py:384-398`), and never creates one. So the ruling
  # needs no example-specific code: these four rows are the whole of it.
  - path: prompts/hello.gpt
    scope: project
    policy: generated
    source: constant
    constant: HELLO_PROMPT
    committed: true
    purpose: >-
      Starter prompt for the hello-world example.

  - path: prompts/reply.gpt
    scope: project
    policy: generated
    source: constant
    constant: HELLO_REPLY_PROMPT
    committed: true

  - path: pipelines/hello-llmflow.yaml
    scope: project
    policy: generated
    source: constant
    constant: HELLO_PIPELINE
    committed: true

  - path: pipelines/hello.yaml
    scope: project
    policy: generated
    source: constant
    constant: HELLO_YAML
    committed: true
    purpose: >-
      Smallest runnable pipeline — one llm step.

  # The audit scaffolding. Ruled 2026-08-24, Q4-Q6: `create-once` for all four. A project
  # adapts its own checklists and index, and `sp doctor` never overwrites them —
  # `managed_by_doctor()` returns only `generated` entries.
  - path: project/audits/README.md
    scope: project
    policy: create-once
    source: constant
    constant: PROJECT_AUDITS_README
    committed: true
    purpose: >-
      How audit findings are recorded for this project.

  - path: docs/audits/INDEX.md
    scope: project
    policy: create-once
    source: constant
    constant: DOCS_AUDITS_INDEX
    committed: true
    purpose: >-
      Index of the audit checklists this project uses.

  - path: docs/audits/audit-passage.md
    scope: project
    policy: create-once
    source: constant
    constant: AUDIT_PASSAGE_CHECKLIST
    committed: true
    purpose: >-
      Checklist for auditing one passage's generated output.

  - path: docs/audits/audit-leadersguide.md
    scope: project
    policy: create-once
    source: constant
    constant: AUDIT_LEADERSGUIDE_CHECKLIST
    committed: true
    purpose: >-
      Checklist for auditing a leaders-guide artifact.

  # Written only when absent — cli_utils.py has no `--update` branch for it, and it is a
  # file people edit constantly (rule 20 makes it the session cache). create-once, so
  # `sp doctor` will never overwrite it.
  - path: project/TODO.md
    scope: project
    policy: create-once
    source: constant
    constant: PROJECT_TODO
    committed: true
    purpose: >-
      Active work, what is in flight, and what not to touch. Read before anything else.

  # A2: pointers at docs/ai-context/rules.md, carrying no rules of their own. The two
  # rules files are block-managed, so a project may keep its own content around sp's
  # block; the Copilot document is written whole.
  - path: .cursorrules
    scope: project
    policy: generated
    source: constant
    constant: CURSORRULES_LLMFLOW_BLOCK
    block: workflow
    committed: true

  - path: .windsurfrules
    scope: project
    policy: generated
    source: constant
    constant: WINDSURFRULES_LLMFLOW_BLOCK
    block: workflow
    committed: true

  # Block-managed from 2026-08-24 (Q2), so a project keeps its own Copilot instructions
  # around sp's block — the same treatment its two siblings already had. Written whole until
  # then, which is why `sp doctor` replaced 72 lines of a consumer repo's instructions with
  # the pointer while `.cursorrules` and `.windsurfrules` survived untouched.
  - path: .github/copilot-instructions.md
    scope: project
    policy: generated
    source: constant
    constant: ASSISTANT_RULES_POINTER
    block: workflow
    committed: true

  # Belongs to the Captain. sp upserts its block on init, doctor never repairs it, and
  # it is gitignored by discipline (D3-A) so a clone never has one.
  - path: CLAUDE.md
    scope: project
    policy: create-once
    source: constant
    constant: CLAUDE_MD_LLMFLOW_BLOCK
    block: workflow
    committed: false

  # Written by runs, not by init. Catalogued so the ignore list can be derived.
  - path: outputs/
    scope: project
    policy: create-once
    source: none
    committed: false

  - path: llmflow.log
    scope: project
    policy: user-owned
    source: none
    committed: false
