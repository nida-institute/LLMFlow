# Paratext Back-Translation Pipeline
# Usage: llmflow run tmp/backtranslation.yaml --project_name ProjectName --book LUK

variables:
  # Paratext base directory (override via env var or --paratext_dir flag)
  paratext_dir: "${PARATEXT_DIR}"

  # Required: Project name (e.g., "MyParatextProject")
  project_name: "${project_name}"

  # Required: Book code (e.g., "LUK", "MAT", "GEN")
  book: "${book}"

  # Output file
  output_file: "outputs/backtranslation/${project_name}_${book}_backtrans.txt"

steps:
  # Load Scripture Burrito metadata (preferred for language info)
  - name: load_metadata
    type: function
    function: load_project_file
    inputs:
      base_dir: "${paratext_dir}"
      project_name: "${project_name}"
      file: "metadata.json"
    outputs:
      - burrito

  - name: load_source
    type: function
    function: load_usfm_book
    inputs:
      base_dir: "${paratext_dir}"
      project_name: "${project_name}"
      book: "${book}"
      format: "usj"
    outputs:
      - source_text

  - name: backtranslate
    type: llm
    model: gpt-4o
    prompt: tmp/backtranslation.gpt
    inputs:
      source_text: "${source_text}"
      book: "${book}"
      # Extract language from Scripture Burrito metadata
      source_language: "${burrito.languages[0].name.en}"
      language_iso: "${burrito.languages[0].tag}"
      project_name: "${burrito.identification.name.en}"
    outputs:
      - backtranslation

  - name: save
    type: function
    function: write_file
    inputs:
      path: "${output_file}"
      content: "${backtranslation}"
